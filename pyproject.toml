[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "filingproof"
version = "0.1.0"
description = "A fact-checker for financial filings that won't make up a number: grounded, cited answers from one document, or an honest refusal."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Wael Alebrahim" }]
keywords = ["finance", "sec", "10-k", "llm", "hallucination", "grounding", "rag", "filings"]
dependencies = ["veritrace"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/waelalebrahim/wa-filingproof"

[tool.setuptools.packages.find]
include = ["filingproof*"]
